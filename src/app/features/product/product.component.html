<div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h2>Add Product</h2>
        <form [formGroup]="productForm" (submit)="onSubmit($event)" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Product Name:</label>
            <input type="text" id="name" formControlName="name" class="form-control mb-2" required>
          </div>
          <div class="mb-3">
            <label for="price" class="form-label">Price:</label>
            <input type="number" id="price" formControlName="price" class="form-control mb-2" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description:</label>
            <textarea id="description" formControlName="description" class="form-control"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Submit</button>
        </form>
      </div>
    </div>
  </div>
