<div class="admin-wrapper">
    <div class="admin-header">
      <h2><i class="bi bi-people-fill"></i> User Management</h2>
      <button class="btn-primary" routerLink="/users/add">
        <i class="bi bi-plus-lg"></i> Add User
      </button>
    </div>
  
    <div class="admin-card">
      <div class="search-bar">
        <div class="search-input">
          <i class="bi bi-search"></i>
          <input 
            type="text" 
            placeholder="Search users..." 
            [(ngModel)]="searchTerm"
            (input)="filterUsers()"
          >
        </div>
      </div>
  
      <div class="table-responsive">
        <table class="users-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Username</th>
              <th>Role</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let user of filteredUsers">
              <td>{{ user.id }}</td>
              <td>{{ user.username }}</td>
              <td>
                <span class="role-badge" [ngClass]="getRoleClass(user.role)">
                  {{ user.role }}
                </span>
              </td>
              <td class="actions">
                <button class="btn-edit" (click)="editUser(user.id)">
                  <i class="bi bi-pencil-square"></i>
                </button>
                <button class="btn-delete" (click)="confirmDelete(user)">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            <tr *ngIf="filteredUsers.length === 0">
              <td colspan="4" class="no-results">
                No users found
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
