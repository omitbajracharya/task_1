<div class="admin-wrapper">
    <div class="admin-card">
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <h2><i class="bi bi-person-plus"></i> Add New User</h2>
  
        <div class="form-group">
          <label>Username</label>
          <input formControlName="username" type="text" placeholder="Enter username" />
          <small *ngIf="userForm.get('username')?.invalid && userForm.get('username')?.touched">
            Username is required
          </small>
        </div>
  
        <div class="form-group">
          <label>Password</label>
          <div class="password-field">
            <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter password" />
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-fill' : 'bi-eye-slash-fill'" (click)="togglePasswordVisibility()"></i>
          </div>
          <small *ngIf="userForm.get('password')?.invalid && userForm.get('password')?.touched">
            Password is required (min 4 characters)
          </small>
        </div>
  
        <div class="form-group">
          <label>Role</label>
          <select formControlName="role">
            <option value="1">Admin</option>
            <option value="2">User</option>
            <option value="3">Manager</option> <!-- Added more roles -->
          </select>
        </div>
  
        <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>
        <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>
  
        <div class="form-actions">
          <button type="submit" [disabled]="isLoading || userForm.invalid">
            {{ isLoading ? 'Creating...' : 'Create User' }}
          </button>
          <button type="button" class="btn-secondary" (click)="resetForm()">
            Reset
          </button>
        </div>
      </form>
    </div>
  </div>
