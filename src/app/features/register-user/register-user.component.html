<div class="register-wrapper">
  <div class="register-card">
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <h2>Register</h2>

      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" type="text" placeholder="Enter username" />
        <small *ngIf="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
          Username is required
        </small>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="password-field">
          <input [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter password" />
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-fill' : 'bi-eye-slash-fill'" (click)="togglePasswordVisibility()"></i>
        </div>
        <small *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Password is required (min 4 characters)
        </small>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="1">Admin</option>
          <option value="2">User</option>
        </select>
      </div>

      <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>

      <button type="submit" [disabled]="isLoading || registerForm.invalid">
        {{ isLoading ? 'Registering...' : 'Register' }}
      </button>

      <div class="switch-link">
        Already have an account? <a routerLink="/login">Login here</a>
      </div>
    </form>
  </div>
</div>
