<div class="container-fluid">
  <div class="row">
    <!-- Sidebar -->
    <div class="col-md-3">
      <div class="sidebar">
        <div class="sidebar-header">
          <h4>Dashboard Menu</h4>
        </div>
        <ul class="nav flex-column">
          <li class="nav-item">
            <button
              (click)="notify()"
              type="button"
              class="nav-link d-flex active"
            >
              <span class="material-symbols-outlined">dashboard</span
              ><span class="ms-2"> Dashboard </span>
            </button>
          </li>
          <li class="nav-item">
            <button
              (click)="openProducts()"
              type="button"
              class="nav-link d-flex"
            >
              <span class="material-symbols-outlined">store</span
              ><span class="ms-2"> Products </span>
            </button>
          </li>
          <li class="nav-item">
            <button
              (click)="openOrders()"
              type="button"
              class="nav-link d-flex"
            >
              <span class="material-symbols-outlined">shopping_cart</span
              ><span class="ms-2"> Orders </span>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link d-flex">
              <span class="material-symbols-outlined">people</span
              ><span class="ms-2"> Customers </span>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link d-flex">
              <span class="material-symbols-outlined">insert_chart</span
              ><span class="ms-2"> Analytics </span>
            </button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link d-flex">
              <span class="material-symbols-outlined">settings</span
              ><span class="ms-2"> Settings </span>
            </button>
          </li>
        </ul>
      </div>
    </div>
    <!-- Main Content Area -->
    <div class="col-md-9">
      <div class="dashboard-header">
        <h2>Welcome to Your Inventory Dashboard</h2>
      </div>
      <div class="dashboard-content">
        <div class="row">
          <div class="col-md-6">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Total Sales</h5>
                <p class="card-text">$10,000</p>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Total Orders</h5>
                <p class="card-text">1000</p>
              </div>
            </div>
          </div>
        </div>
        <div class="row mt-4">
          <div class="col-md-12">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Recent Orders</h5>
                <table class="table">
                  <thead>
                    <tr>
                      <th>Order ID</th>
                      <th>Customer</th>
                      <th>Product</th>
                      <th>Total</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>John Doe</td>
                      <td>Product A</td>
                      <td>$100</td>
                      <td><span class="badge badge-success">Shipped</span></td>
                    </tr>
                    <tr>
                      <td>2</td>
                      <td>Jane Doe</td>
                      <td>Product B</td>
                      <td>$150</td>
                      <td>
                        <span class="badge badge-warning">Processing</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
