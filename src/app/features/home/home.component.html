<div class="dashboard">
  <h1>Dashboard</h1>
  <div *ngIf="dashboardStats">
    <div>
      <h3>Total Sales: {{ dashboardStats.totalSales | currency }}</h3>
      <h3>Today's Sales: {{ dashboardStats.todaySales | currency }}</h3>
    </div>
    <div *ngIf="dashboardStats.popularItem">
      <h3>Popular Item: {{ dashboardStats.popularItem.name }}</h3>
      <p>Sold: {{ dashboardStats.popularItem.salesCount }}</p>
    </div>
  </div>
</div>
